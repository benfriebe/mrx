[package]
name = "mrx"
version = "0.3.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
configparser = "3"
# Spelled out rather than "full": mrx runs child processes and timers, it
# never opens a socket, so "full" was compiling tokio's whole net stack for
# nothing.
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
ratatui = "0.30"
thiserror = "2"
crossterm = "0.29"
num_cpus = "1"
dirs = "6"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
# Paused clocks for the ticker tests, which would otherwise spend seconds of
# every `cargo test` waiting on real time.
tokio = { version = "1", features = ["test-util"] }

[profile.dev]
# Enough debuginfo for a backtrace with line numbers, without the full type
# information a debugger wants. Most of a dev build's link time is spent on
# what this drops.
debug = "line-tables-only"

[profile.release]
lto = true
strip = true

# Apollo's Rust handbook, chapter 2.5: the lint set lives with the package so
# an editor, a bare `cargo clippy` and CI all see the same one.
#
# Groups take a negative priority so the individual entries below can override
# them; cargo applies higher-priority lints last.
[lints.rust]
future-incompatible = "warn"
nonstandard-style = "deny"

[lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "warn", priority = -1 }

# The handbook's table of lints worth enforcing past `all`. The first two are
# nursery, so they need naming rather than a group.
redundant_clone = "deny"
needless_collect = "deny"
large_enum_variant = "deny"
unnecessary_wraps = "deny"

# mrx is a binary. These three document a public API nobody can import, and
# `#[must_use]` on every accessor buys noise rather than a caught bug.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Doc comments here open with the sentence that explains the item, not with a
# summary line and the explanation after it.
too_long_first_doc_paragraph = "allow"
